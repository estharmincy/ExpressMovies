<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExpressMovies | My Bookings</title>

<style>
:root {
    --green: #173F35;
    --green-light: #DCE8DF;
    --ivory: #FAF8F2;
    --gold: #C6A96B;
    --text: #252A27;
    --muted: #727A73;
    --white: #FFFFFF;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--ivory);
    color: var(--text);
}

header {
    background: var(--green);
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 27px;
    font-weight: 800;
}

.logo span {
    color: var(--gold);
}

nav {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

nav a:hover,
nav a.active {
    color: var(--gold);
}

.container {
    width: 86%;
    max-width: 1100px;
    margin: 45px auto;
}

.heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 30px;
}

.heading h1 {
    font-size: 32px;
    color: var(--green);
}

.heading p {
    margin-top: 8px;
    color: var(--muted);
}

.refresh-btn {
    background: var(--green);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}

.booking-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
}

.booking-card {
    background: white;
    border: 1px solid #E4E6DD;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 5px 20px #173F350A;
}

.booking-card h2 {
    font-size: 21px;
    color: var(--green);
    margin-bottom: 15px;
    overflow-wrap: anywhere;
}

.booking-id {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 18px;
}

.detail {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 11px 0;
    border-bottom: 1px solid #EEEEEA;
    font-size: 13px;
}

.detail span:first-child {
    color: var(--muted);
}

.detail strong {
    text-align: right;
    overflow-wrap: anywhere;
}

.amount {
    color: var(--green);
    font-size: 19px;
}

.badge {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    background: var(--green-light);
    color: var(--green);
    font-size: 12px;
    font-weight: bold;
    margin-top: 18px;
}

.badge.cancelled {
    background: #FBE7E4;
    color: #982F2F;
}

.cancel-btn {
    width: 100%;
    margin-top: 20px;
    background: white;
    color: #9A3838;
    border: 1px solid #D8A5A5;
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    font-weight: 600;
}

.cancel-btn:hover {
    background: #FFF0EE;
}

.cancel-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.message {
    background: white;
    border-radius: 14px;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    line-height: 1.8;
    grid-column: 1 / -1;
}

.message a {
    display: inline-block;
    margin-top: 18px;
    padding: 12px 20px;
    background: var(--green);
    color: white;
    border-radius: 8px;
    text-decoration: none;
}

footer {
    background: var(--green);
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 60px;
    font-size: 13px;
}

@media(max-width:600px) {
    header {
        padding: 20px 6%;
    }

    nav {
        gap: 15px;
    }

    .container {
        width: 90%;
    }
}
header {
    height: 75px;
    padding: 0 5%;
}

.container {
    width: 92%;
    max-width: 1200px;
    margin: 25px auto;
}

.heading {
    margin-bottom: 20px;
}

.heading h1 {
    font-size: 27px;
}

.booking-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
}

.booking-card {
    padding: 18px;
}

.booking-card h2 {
    font-size: 18px;
    margin-bottom: 10px;
}

.detail {
    padding: 8px 0;
    font-size: 12px;
}

.cancel-btn {
    margin-top: 12px;
    padding: 10px;
}

footer {
    padding: 12px;
    margin-top: 20px;
}

@media (max-width: 900px) {
    .booking-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 600px) {
    .booking-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Express<span>Movies</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="booking.html">Book Tickets</a>
        <a href="my-bookings.html" class="active">My Bookings</a>
    </nav>
</header>

<main class="container">

    <div class="heading">
        <div>
            <h1>My Bookings</h1>
            <p>View and manage your movie ticket bookings.</p>
        </div>

        <button class="refresh-btn" onclick="loadBookings()">
            Refresh Bookings
        </button>
    </div>

    <section class="booking-grid" id="bookingGrid">
        <div class="message">Loading bookings...</div>
    </section>

</main>

<footer>
    © 2026 ExpressMovies | Thank You For Choosing Us
</footer>

<script>
async function loadBookings() {
    const grid = document.getElementById("bookingGrid");

    grid.innerHTML = "";

    const loading = document.createElement("div");
    loading.className = "message";
    loading.textContent = "Loading bookings...";
    grid.appendChild(loading);

    try {
        const response = await fetch("/api/bookings");

        if (!response.ok) {
            throw new Error("Unable to retrieve bookings");
        }

        const bookings = await response.json();

        grid.innerHTML = "";

        if (!Array.isArray(bookings) || bookings.length === 0) {
            showEmptyMessage(
                "No bookings found. Book your favourite movie to get started."
            );
            return;
        }

        bookings.forEach(booking => {
            grid.appendChild(createBookingCard(booking));
        });

    } catch (error) {
        grid.innerHTML = "";

        const message = document.createElement("div");
        message.className = "message";
        message.textContent =
            "Unable to load bookings. Please check whether GET /api/bookings is implemented.";

        grid.appendChild(message);
    }
}

function showEmptyMessage(text) {
    const grid = document.getElementById("bookingGrid");

    grid.innerHTML = "";

    const message = document.createElement("div");
    message.className = "message";

    const paragraph = document.createElement("p");
    paragraph.textContent = text;

    const link = document.createElement("a");
    link.href = "index.html";
    link.textContent = "Explore Movies";

    message.append(paragraph, link);
    grid.appendChild(message);
}

function addDetail(card, label, value, amount = false) {
    const row = document.createElement("div");
    row.className = "detail";

    const name = document.createElement("span");
    name.textContent = label;

    const result = document.createElement("strong");
    result.textContent = value ?? "N/A";

    if (amount) {
        result.className = "amount";
    }

    row.append(name, result);
    card.appendChild(row);
}

function createBookingCard(booking) {
    const card = document.createElement("article");
    card.className = "booking-card";

    const title = document.createElement("h2");
    title.textContent = booking.movieTitle || booking.title || "Movie Booking";

    const id = document.createElement("div");
    id.className = "booking-id";
    id.textContent = "Booking ID: " + (booking.id ?? "N/A");

    card.append(title, id);

    addDetail(card, "Customer", booking.customerName);
    addDetail(card, "Theatre", booking.theatreName);
    addDetail(card, "Show Date", booking.showDate);
    addDetail(card, "Show Time", booking.showTime);
    addDetail(card, "Seats", booking.seats);
    addDetail(card, "Tickets", booking.numberOfTickets);
    addDetail(
        card,
        "Total Amount",
        "₹" + Number(booking.totalAmount ?? 0).toFixed(2),
        true
    );

    const status = document.createElement("span");
    status.className = "badge";

    const currentStatus = String(booking.status || "BOOKED").toUpperCase();
    status.textContent = currentStatus;

    if (currentStatus === "CANCELLED") {
        status.classList.add("cancelled");
    }

    card.appendChild(status);

    if (currentStatus !== "CANCELLED") {
        const button = document.createElement("button");
        button.className = "cancel-btn";
        button.textContent = "Cancel Booking";

        button.addEventListener("click", async () => {
            if (!confirm("Are you sure you want to cancel this booking?")) {
                return;
            }

            button.disabled = true;
            button.textContent = "Cancelling...";

            try {
                const response = await fetch(
                    "/api/bookings/" +
                    encodeURIComponent(booking.id) +
                    "/cancel",
                    { method: "PUT" }
                );

                if (!response.ok) {
                    throw new Error("Cancellation failed");
                }

                alert("Booking cancelled successfully.");
                await loadBookings();

            } catch (error) {
                alert(
                    "Unable to cancel. Check whether PUT /api/bookings/{id}/cancel exists."
                );

                button.disabled = false;
                button.textContent = "Cancel Booking";
            }
        });

        card.appendChild(button);
    }

    return card;
}

loadBookings();
</script>

</body>
</html>
